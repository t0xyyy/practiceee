<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#136c5c"><meta name="description" content="Учусь.РФ — платформа дистанционного образования и записи на онлайн-курсы."><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/styles.css"><title>Регистрация · Учусь.РФ</title></head><body><div id="site-header"></div><main class="auth-wrap"><section class="auth-decor"><div class="auth-decor-content"><div class="eyebrow" style="color:#bddecf">Добро пожаловать</div><h2>Большие планы начинаются с малого шага.</h2><p>Один аккаунт — все ваши курсы, заявки, история обучения и отзывы.</p><img src="/assets/hero.svg" alt="Образовательная платформа" width="500" height="430"></div></section><section class="auth-panel"><div class="auth-box"><div class="eyebrow"><span class="eyebrow-dot"></span> Начнём знакомство</div><h1>Регистрация</h1><p>Заполните несколько полей и начните учиться уже сегодня.</p><form id="register-form" novalidate><div class="field"><label for="fullName">Фамилия, имя и отчество</label><input id="fullName" name="fullName" autocomplete="name" maxlength="120" placeholder="Иванов Иван Иванович" required><span class="field-error" id="err-fullName"></span></div><div class="field"><label for="login">Логин</label><input id="login" name="login" autocomplete="username" maxlength="60" placeholder="Например, ivan2026" required><div class="hint">От 6 символов: латинские буквы и цифры.</div><span class="field-error" id="err-login"></span></div><div class="field"><label for="password">Пароль</label><input id="password" name="password" autocomplete="new-password" type="password" maxlength="128" placeholder="Не менее 8 символов" required><span class="field-error" id="err-password"></span></div><div class="field-row"><div class="field"><label for="phone">Телефон</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 999 123-45-67" required><span class="field-error" id="err-phone"></span></div><div class="field"><label for="email">Электронная почта</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.ru" required><span class="field-error" id="err-email"></span></div></div><div class="form-error" id="form-error" role="alert"></div><button class="btn btn-block" id="submit-register" type="submit">Создать аккаунт ↗</button></form><p class="auth-footnote">Уже зарегистрированы? <a class="link" href="/login.html">Войти в аккаунт</a></p></div></section></main><div id="site-footer"></div><div id="toast-stack" class="toast-stack" aria-live="polite"></div><script type="module" src="/js/register.js"></script></body></html>
